<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171716"/>
      <stop offset="1" stop-color="#090a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9f7650"/>
      <stop offset=".48" stop-color="#ead3ad"/>
      <stop offset="1" stop-color="#fff0cc"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="1" x2=".8" y2="0">
      <stop offset="0" stop-color="#6f4f35"/>
      <stop offset=".5" stop-color="#c7a477"/>
      <stop offset="1" stop-color="#f1d6aa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bg)"/>
  <rect x="19.5" y="19.5" width="473" height="473" rx="110.5"
        fill="none" stroke="url(#gold)" stroke-width="3"/>

  <!-- Mountains -->
  <path d="M72 392 L226 205 L300 282 L360 224 L442 392 Z"
        fill="url(#mountain)" opacity=".95" filter="url(#shadow)"/>
  <path d="M72 392 L226 205 L300 282"
        fill="none" stroke="#f4dfbc" stroke-width="5" stroke-linejoin="round"/>
  <path d="M300 282 L360 224 L442 392"
        fill="none" stroke="#b78d5f" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ascending line / arrow -->
  <path d="M72 337 C137 286 177 267 226 236 L285 281 L365 187"
        fill="none" stroke="url(#gold)" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M348 187 L371 181 L365 204"
        fill="none" stroke="#f7e5c4" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- subtle highlight -->
  <path d="M91 350 C145 309 184 286 226 259"
        fill="none" stroke="#fff3d9" stroke-width="2.5" opacity=".55" stroke-linecap="round"/>
</svg>